[package]
name = "jiaoren"
version = "0.1.0"
edition = "2021"
description = "jiaoren (jr) — a zathura-like Markdown viewer with mermaid diagrams"

[[bin]]
name = "jr"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
egui_commonmark = "0.25"
egui_extras = { version = "0.36", features = ["image", "file", "svg", "svg_text"] }
notify = "8"
blake3 = "1"
resvg = "0.48"
thiserror = "2"
anyhow = "1"

[lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
